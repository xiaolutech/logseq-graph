[workspace]
members = ["crates/graph", "crates/server"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Tests run at opt-level 1: the five 10,000-level nesting tests take about 15 s each unoptimized and
# dominate the suite (60 s -> 15 s locally), while a cold test build grows only 15 s -> 35 s. Release
# and ordinary dev builds are unchanged.
[profile.test]
opt-level = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

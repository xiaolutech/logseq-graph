[package]
name = "logseq-graph-cli"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "CLI and loopback Logseq API server for file-based Logseq graphs"
repository = "https://github.com/xiaolutech/logseq-graph"
publish = false

# Not on crates.io; released as prebuilt binaries on GitHub Releases by dist.
[package.metadata.dist]
dist = true

[[bin]]
name = "logseq-graph"
path = "src/main.rs"

[dependencies]
logseq-graph = { path = "../graph" }
# The CLI was dependency-free because printing one answer needs nothing else. `serve` is the first
# command that speaks HTTP and JSON: httparse parses request heads, while serde and serde_json
# keep JSON escaping and typed serialization out of the socket transport.
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify = "8.2.2"

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true

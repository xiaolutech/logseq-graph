name: Dependency audit

# `cargo deny` also runs in CI on every push, but only a scheduled run catches a RUSTSEC advisory
# published while the lockfile is unchanged (see `deny` in the justfile).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.11.9
      - name: Check dependencies
        run: mise exec -- just deny

name: Dependency audit

# `cargo deny` also runs in CI on every push, but only a scheduled run catches a RUSTSEC advisory
# published while the lockfile is unchanged (see `deny` in the justfile).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
      - name: Check dependencies
        run: mise exec -- just deny

name: CI

on:
  push:
    branches:
      - main
      - 'devin/**'
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running check; every main commit
# still gets its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A `devin/**` branch already runs on push; its pull request from this repository would check the
    # same commit a second time.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'devin/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Check authored commit subjects, not GitHub's synthetic PR merge subject.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.11.9
      - name: Install Rust lint components
        run: mise exec -- rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Profile settings in Cargo.toml do not change this action's cache key, so a cache built
          # before `[profile.test] opt-level = 1` would be restored as a full match and never
          # replaced. Bump this when a profile change should start a fresh cache.
          key: test-opt-level-1
      - name: Run repository checks
        # Match the canonical paths returned by the graph on macOS (/private/var).
        run: TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)" mise exec -- just check
      - name: Check dependencies
        run: mise exec -- just deny
